<!DOCTYPE html>
<html>
<head><title>Акции</title></head>
<body>
<h1>Список акций</h1>

<form method="post" action="{% url 'add_promotion' %}">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Название" required>
    <textarea name="description" placeholder="Описание"></textarea>
    <button type="submit">Добавить акцию</button>
</form>

<ul>
    {% for promo in promotions %}
    <li>
        <a href="{% url 'promotion_detail' promo.pk %}">{{ promo.title }}</a>
        <a href="{% url 'edit_promotion' promo.pk %}"> | Редактировать |</a>
        <form method="post" action="{% url 'delete_promotion' promo.pk %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Удалить</button>
        </form>
    </li>
    {% empty %}
    <li>Акций нет</li>
    {% endfor %}
</ul>
</body>
</html>
